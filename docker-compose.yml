services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-agent-market-intelligence:latest
    container_name: market-intelligence-api
    ports:
      - "8000:8000"
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - API_DEBUG=false
      - API_DEFAULT_CASH=100000.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
