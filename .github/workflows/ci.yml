name: CI

"on":
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run Ruff lint check
        run: ruff check src tests

      - name: Run Ruff format check
        run: ruff format --check src tests

      - name: Run Mypy strict typecheck
        run: mypy src

  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run pytest with coverage
        run: pytest --cov=multi_agent_market_intelligence --cov-report=term --cov-report=xml tests

  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t multi-agent-market-intelligence:ci .

      - name: Run container
        run: docker run -d --name market-intelligence-api -p 8000:8000 multi-agent-market-intelligence:ci

      - name: Validate health probe
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Healthcheck probe successful"
              exit 0
            fi
            sleep 1
          done
          echo "Healthcheck probe timed out"
          docker logs market-intelligence-api
          exit 1
